  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Roleta</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 10px; }
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-width: 400px; margin: 15px auto; }
    button { padding: 15px 0; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; color: white; cursor: pointer; }
    .btn-green { background: #2e7d32; grid-column: span 6; }
    .btn-red { background: #c62828; }
    .btn-black { background: #212121; border: 1px solid #444; }
    #log { margin-top: 15px; font-size: 14px; color: #aaa; word-wrap: break-word; }
  </style>
</head>
<body>
  <h2>Entrada de Números</h2>
  <div class="grid">
    <button class="btn-green" onclick="sendNumber(0)">0</button>
    <script>
      const reds = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
      for (let i = 1; i <= 36; i++) {
        const isRed = reds.includes(i);
        const btnClass = isRed ? 'btn-red' : 'btn-black';
        document.write(`<button class="${btnClass}" onclick="sendNumber(${i})">${i}</button>`);
      }
    </script>
  </div>
  <div id="log">Aguardando envio...</div>

  <script>
    async function sendNumber(num) {
      document.getElementById('log').innerText = `Enviando: ${num}...`;
      try {
        const res = await fetch('/api/number', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number: num })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('log').innerText = `Último enviado: ${num} | Histórico: ${data.history.join(', ')}`;
        }
      } catch (e) {
        document.getElementById('log').innerText = 'Erro ao enviar número.';
      }
    }
  </script>
</body>
</html>
